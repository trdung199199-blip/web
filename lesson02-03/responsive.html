<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h2, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* PC */
        /* PC width >= 1024 -> min-width */

        /* tablet */
        /* width >= 740 va width < 1024 */
        /* min-width: 740px max 1023px */

        /* mobile */
        /* max 739px */
        body {
            background-color: burlywood;
            display: flex;
            height: 100vh;
            line-height: 100vh;
        }

        .mobile, .tablet, .pc {
            color: blue;
            font-size: 10vh;
            display: none;
            margin: 0 auto;
        }
        /* PC */
        /* PC width >= 1024 -> min-width */
        @media screen  and (min-width: 1024px) {
            .pc{
                display: block;
                background-color: aquamarine;
            }
        }
        
        /* tablet */
        /* width >= 740 va width < 1024 */
        /* min-width: 740px max 1023px */
        @media  screen and (min-width: 740px) and (max-width: 1023px) {
            .tablet {
                display: block;
            }
        }
        /* mobile */
        /* max 739px */
        @media screen and (max-width: 740px)  {
            .mobile {
                display: block;
            }
        }
    </style>
</head>
<body>
    <h2 class="mobile">Mobile</h2>
    <h2 class="tablet">Tablet</h2>
    <h2 class="pc">PC</h2>
    
</body>
</html>
