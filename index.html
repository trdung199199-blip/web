<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai tap</title>
    <style>
      .p {
        color: red; 
      }
    </style>
  </head>
  <body>
    <div>
      <label>Textarea</label>
      <br>
      <textarea id="textarea" maxlength="140"></textarea>
      <p id="dem" class="p">Max 0/140</p>
      <hr>
    </div>
    
    <div>
    <label>Input Field</label>
    <br>
    <input type="text" id="text" maxlength="20">
    <p id="dem1" class="p">Maximum 0/20</p>
    </div>
    <script>
      const textarea = document.getElementById("textarea");      
      const dem = document.getElementById("dem");
      const text = document.getElementById("text");      
      const dem1 = document.getElementById("dem1");

      textarea.addEventListener("input", () => {
        const soKyTu = textarea.value.length;
        dem.textContent = `Max ${soKyTu}/140`;
      });
    
      text.addEventListener("input", () => {
        const kyTu = text.value.length;
        dem1.textContent = `Maximum ${kyTu}/20`;
      });
    </script>
  </body>
</html>
